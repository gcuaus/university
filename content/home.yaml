stepsEyebrow: Getting Started
stepsTitle: How to Enroll at Great Commission University of America
stepsBody: >-
  Beginning your educational journey at Great Commission University of America
  (GCUA) is a meaningful step toward greater biblical knowledge, spiritual growth,
  and preparation for Christian ministry. Our enrollment process is designed to be
  personal, prayerful, and straightforward.
steps:
  - title: Begin with Prayer and Fasting
    body: >-
      Before enrolling, we encourage prospective students to spend intentional time
      in prayer and, when appropriate, fasting, seeking God's wisdom and guidance
      concerning their educational and ministry journey.
  - title: Request Your Academic Evaluation
    body: >-
      Submit information about your previous education, theological training,
      ministry experience, and academic goals. GCUA will review your background and
      help determine the academic program that best corresponds with your
      qualifications and ministry objectives.
  - title: Receive Your Personalized Academic Plan
    body: >-
      Following your evaluation, you will receive a recommended academic pathway
      outlining your degree requirements, applicable transfer credits, remaining
      courses, and estimated progression toward completion.
  - title: Complete Your Enrollment and Registration
    body: >-
      Complete the required application and registration process and submit the
      necessary academic documents. Once approved, you will receive information
      regarding your program, courses, tuition arrangements, and academic resources.
  - title: Study, Grow, and Complete Your Degree
    body: >-
      Begin your courses and progress systematically through your academic program,
      completing assigned readings, coursework, examinations, and research while
      receiving guidance throughout your educational journey.
