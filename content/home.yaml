welcomeEyebrow: A Personal Invitation
welcomeTitle: |-
  Pursue Your Degree.
  Prepare for Your Calling.
welcomeBody: >-
  Great Commission University of America (GCUA) provides biblically grounded,
  academically focused, and ministry-centered higher education for men and
  women called to serve Christ and His Church.

  As a Pentecostal-Charismatic institution, GCUA affirms the authority of
  Scripture and the continuing work and power of the Holy Spirit. Our programs
  integrate biblical studies, theological education, spiritual formation,
  leadership development, and practical ministry preparation.

  Whether you are preparing for pastoral ministry, Christian education,
  missions, evangelism, counseling, church leadership, or deeper biblical
  study, GCUA offers flexible learning opportunities designed to equip you for
  effective Christian service.
welcomeClosing: Study from wherever you are. Grow in knowledge. Be empowered by the Spirit. Fulfill your calling.
welcomeSignatureName: Dr. Ferdinand Saerang
welcomeSignatureTitle: President of Great Commission University of America
offerTitle: What We Offer Every Student
offerBody: ''
offerItems:
  - A complimentary personal evaluation of your educational background, ministry experience, and academic goals
  - Flexible, interest-free payment options designed to make Christian higher education more accessible
  - A biblically grounded, Christ-centered, and Spirit-empowered curriculum rooted in sound Pentecostal and Charismatic theology
  - Purposefully structured coursework designed to minimize unnecessary repetition and support steady academic progression
  - "Personalized academic guidance from faculty committed to students' spiritual, intellectual, and ministry development"
  - Systematic and progressive studies that move students from foundational knowledge to advanced biblical, theological, and ministry competency
  - Opportunities to receive academic credit for documented ministry training and qualifying prior learning, subject to institutional evaluation
  - Transfer credit consideration for eligible coursework completed at qualified Bible colleges, seminaries, and other institutions
  - Alternative academic pathways for qualified students with previous education, ministry training, or significant ministry experience
whyEyebrow: Why Choose GCUA
whyTitle: A Spirit-Empowered Christian University for Biblical and Ministry Education
whyBody: >-
  Great Commission University of America exists to provide accessible, affordable,
  and academically structured Christian higher education for believers who desire to
  grow in biblical knowledge, spiritual formation, leadership, and ministry without
  leaving their church, family, career, or ministry responsibilities.
