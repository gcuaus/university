welcomeEyebrow: Our vision
welcomeTitle: Leaders who make disciples and advance God's Kingdom.
welcomeBody: We develop Christ-centered, biblically grounded, and Holy Spirit-empowered leaders who make disciples and advance God's Kingdom. Our graduates serve as transformational leaders in churches, families, communities, and nations.
programsEyebrow: Our educational approach
programsTitle: Know God's Word. Know God's ways. Do God's work.
programsBody: We provide Christ-centered, Bible-based, and Spirit-empowered education that combines academic learning, spiritual formation, and practical ministry.
programOneTitle: Associate of Arts in Biblical Studies
programOneBody: The Associate of Arts in Biblical Studies introduces students to biblical interpretation, Christian theology, and practical ministry from a Pentecostal–Charismatic perspective.
programTwoTitle: Bachelor of Theology (Th.B.)
programTwoBody: The Bachelor of Theology prepares students for pastoral ministry, evangelism, Christian education, missions, and church leadership. The program emphasizes biblical scholarship, theological understanding, and Spirit-empowered ministry.
programThreeTitle: Master of Divinity (M.Div.)
programThreeBody: The Master of Divinity is a professional graduate degree designed to prepare students for pastoral leadership, preaching, evangelism, missions, church planting, and other areas of Christian ministry.
ctaTitle: Prepare to fulfill the Great Commission.
ctaBody: Discover how Christ-centered, Bible-based, Spirit-empowered education can prepare you for Christian leadership and effective Kingdom service.
ctaButton: Begin your application
invitationEyebrow: A Personal Invitation
invitationTitle: Pursue Your Degree. Prepare for Your Calling.
invitationBody: >-
  Great Commission University of America (GCUA) provides biblically grounded,
  academically focused, and ministry-centered higher education for men and women
  called to serve Christ and His Church. As a Pentecostal-Charismatic institution,
  GCUA affirms the authority of Scripture and the continuing work and power of
  the Holy Spirit. Our programs integrate biblical studies, theological education,
  spiritual formation, leadership development, and practical ministry preparation.
  Whether you are preparing for pastoral ministry, Christian education, missions,
  evangelism, counseling, church leadership, or deeper biblical study, GCUA offers
  flexible learning opportunities designed to equip you for effective Christian
  service.
invitationTagline: Study from wherever you are. Grow in knowledge. Be empowered by the Spirit. Fulfill your calling.
invitationName: Dr. Ferdinand Saerang
