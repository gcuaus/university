heroEyebrow: TUITION & FEES
heroTitle: Affordable Tuition Through Generous Support
heroDescription: |
  Through the generosity of our donors and the support of our Ecclesiastical Scholarship Program, Great Commission University of America strives to make its academic programs financially manageable and accessible to all students.

  Our goal is to reduce financial barriers so that students can focus on their education, spiritual formation, and preparation for Christian ministry and leadership.

  Great Commission University of America is committed to keeping tuition and fees as affordable as possible. Tuition and fees are established based on the cost of instructional materials, academic services, and institutional operating expenses. All tuition and fees are subject to change as institutional costs and educational expenses change.
planEyebrow: TUITION BY DEGREE LEVEL
planTitle: Estimate your monthly tuition
planDescription: Every program includes a $110 matriculation fee, approximately $250 in books, and $15 shipping. After the listed down payment, the balance is financed interest-free over 12 or 18 months. North Carolina residents add sales tax on books. Application, course, and graduation fees are listed separately below and are not included in these estimates.
