<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — GCTSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1C2E; --gold:#C6992F; --gold-soft:#DDBB6A; --maroon:#7A2331;
    --text-light:#ECE4D0; --muted:#9BA8B9; --line:rgba(236,228,208,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--ink);color:var(--text-light);
    font-family:'Source Sans 3',sans-serif;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .seal{
    width:84px;height:84px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;
    justify-content:center;font-family:'Fraunces',serif;font-size:32px;color:var(--gold);margin:0 auto 32px;position:relative;
  }
  .seal::before{content:"";position:absolute;inset:6px;border:1px solid rgba(198,153,47,0.4);border-radius:50%;}
  .fol{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;}
  h1{font-family:'Fraunces',serif;font-weight:400;font-style:italic;font-size:clamp(32px,5vw,54px);margin:0 0 18px;}
  p{color:var(--muted);font-size:16px;max-width:440px;margin:0 auto 36px;line-height:1.6;}
  a.btn{
    display:inline-block;background:var(--gold);color:var(--ink);font-weight:600;padding:13px 28px;
    text-decoration:none;font-size:14px;letter-spacing:0.02em;border-radius:1px;
  }
  a.btn:hover{background:var(--gold-soft);}
  .verse{margin-top:48px;font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--gold-soft);border-top:1px solid var(--line);padding-top:24px;}
</style>
</head>
<body>
  <div>
    <div class="seal">G</div>
    <div class="fol">Fol. 404</div>
    <h1>This folio could not be found</h1>
    <p>The page you're looking for may have been moved, renamed, or never existed. Let's get you back to solid ground.</p>
    <a class="btn" href="/">Return Home</a>
    <div class="verse">"The entrance of thy words giveth light." — Psalm 119:130</div>
  </div>
</body>
</html>
